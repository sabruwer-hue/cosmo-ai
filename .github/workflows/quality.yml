name: Cosmo quality checks
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
      - name: Validate Cosmo application files
        run: node scripts/check-cosmo.mjs
      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/cosmo-chat/index.ts supabase/functions/cosmo-admin-gate/index.ts supabase/functions/cosmo-access-gate/index.ts supabase/functions/cosmo-yoco-checkout/index.ts supabase/functions/cosmo-yoco-webhook/index.ts supabase/functions/cosmo-payfast-checkout/index.ts supabase/functions/cosmo-payfast-itn/index.ts
