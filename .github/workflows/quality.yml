name: Cosmo quality checks
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
      - name: Validate Cosmo application files
        run: node scripts/check-cosmo.mjs
      - name: Test strategy selection engine
        run: deno test supabase/functions/_shared/strategy-engine.test.ts
      - name: Test strategy benchmark harness
        run: deno test supabase/functions/_shared/strategy-benchmark.test.ts
      - name: Test independent intelligence review gates
        run: deno test supabase/functions/_shared/intelligence-review.test.ts
      - name: Type-check Cosmo chat (known legacy check warning)
        continue-on-error: true
        run: deno check supabase/functions/cosmo-chat/index.ts
      - name: Type-check Cosmo admin gate
        run: deno check supabase/functions/cosmo-admin-gate/index.ts
      - name: Type-check lifetime entitlement gate
        run: deno check supabase/functions/cosmo-access-gate/index.ts
      - name: Type-check Yoco checkout (temporary type warning)
        continue-on-error: true
        run: deno check supabase/functions/cosmo-yoco-checkout/index.ts
      - name: Type-check Yoco webhook
        run: deno check supabase/functions/cosmo-yoco-webhook/index.ts
      - name: Type-check retired PayFast stubs
        run: deno check supabase/functions/cosmo-payfast-checkout/index.ts supabase/functions/cosmo-payfast-itn/index.ts
